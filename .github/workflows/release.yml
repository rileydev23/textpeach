# Publishing a release (from the draft kept by release-drafter.yml) builds TextPeach.exe with that version and
# attaches it to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write  # upload the exe to the release

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test -c Release
      - name: Build the portable exe
        shell: cmd
        # v1.2.3 -> 1.2.3, stamped into the exe (About shows it).
        run: |
          set TAG=${{ github.event.release.tag_name }}
          call build.cmd %TAG:v=%
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/TextPeach.exe --clobber
