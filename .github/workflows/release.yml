# Publishing a release (from the draft kept by release-drafter.yml) builds TextPeach for Windows and Linux with the
# release's version, checks that each build starts, builds the installers (textpeach-windows-x64-setup.exe and the install.sh in the
# Linux archive), checks that they install and uninstall, and attaches everything to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write  # upload the builds to the release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test -c Release
      - name: Build the portable exe
        shell: cmd
        # v1.2.3 -> 1.2.3, stamped into the exe (About shows it).
        run: |
          set TAG=${{ github.event.release.tag_name }}
          call build.cmd %TAG:v=%
      - name: Check that it starts
        shell: pwsh
        run: |
          $p = Start-Process dist/TextPeach.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "TextPeach.exe exited at startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          & $iscc /Qp "/DAppVersion=$version" installer\TextPeach.iss
          if ($LASTEXITCODE) { throw "ISCC failed with code $LASTEXITCODE" }
      - name: Check that the installer installs, registers and uninstalls
        shell: pwsh
        run: |
          # Not Start-Process -Wait: it also waits for child processes, and the silent install leaves TextPeach running.
          $setup = Start-Process dist\textpeach-windows-x64-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "The installer did not finish in 5 minutes" }
          if ($setup.ExitCode -ne 0) { throw "The installer exited with code $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\TextPeach"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\TextPeach.lnk"
          foreach ($f in "$app\TextPeach.exe", "$app\installed.txt", "$app\unins000.exe", $lnk) {
            if (-not (Test-Path $f)) { throw "Missing after install: $f" }
          }
          # Explorer integration: the context menu entries and one of the registered types.
          $keys = 'HKCU:\Software\Classes\*\shell\TextPeach\command', 'HKCU:\Software\Classes\Directory\shell\TextPeach\command',
                  'HKCU:\Software\Classes\Directory\Background\shell\TextPeach\command', 'HKCU:\Software\Classes\TextPeach.md\shell\open\command',
                  'HKCU:\Software\TextPeach\Capabilities\FileAssociations'
          foreach ($k in $keys) { if (-not (Test-Path -LiteralPath $k)) { throw "Missing after install: $k" } }
          if ($null -eq (Get-ItemProperty 'HKCU:\Software\Classes\.md\OpenWithProgids').'TextPeach.md') { throw "TextPeach.md is not in .md\OpenWithProgids" }
          # The silent install opens TextPeach (that is how an update restarts it): it must still be running.
          Start-Sleep -Seconds 15
          $p = Get-Process TextPeach -ErrorAction SilentlyContinue
          if (-not $p) { throw "TextPeach did not start after the silent install" }
          $p | Stop-Process -Force
          # The uninstaller hands over to a copy of itself in %TEMP% and exits at once, so poll for the result.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          $deadline = (Get-Date).AddMinutes(2)
          while (((Test-Path "$app\TextPeach.exe") -or (Test-Path $lnk)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ((Test-Path "$app\TextPeach.exe") -or (Test-Path $lnk)) { throw "Uninstall left files behind" }
          foreach ($k in $keys) { if (Test-Path -LiteralPath $k) { throw "Uninstall left the registry entry $k" } }
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Descriptive names for the release; the exe itself (and the installed one) stays TextPeach.exe.
        run: |
          Copy-Item dist/TextPeach.exe dist/textpeach-windows-x64-portable.exe
          gh release upload "${{ github.event.release.tag_name }}" dist/textpeach-windows-x64-portable.exe dist/textpeach-windows-x64-setup.exe --clobber

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test -c Release
      - name: Build the portable binary
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./build.sh "${TAG#v}"
      - name: Check that it starts
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxi6 libxrandr2 libxcursor1
          # Still running after 15 s means it started; timeout then stops it with code 124.
          set +e
          xvfb-run -a timeout 15 dist/TextPeach
          code=$?
          if [ $code -ne 124 ]; then echo "::error::TextPeach exited at startup with code $code"; exit 1; fi
      - name: Package it with its installer
        run: |
          cp installer/linux/install.sh installer/linux/uninstall.sh installer/installed.txt dist/
          cp src/TextPeach/Assets/logo.png dist/textpeach.png
          chmod +x dist/install.sh dist/uninstall.sh
          tar -czf textpeach-linux-x64.tar.gz -C dist TextPeach install.sh uninstall.sh installed.txt textpeach.png
      - name: Check that install.sh and uninstall.sh work
        run: |
          mkdir -p /tmp/tp && tar -xzf textpeach-linux-x64.tar.gz -C /tmp/tp
          /tmp/tp/install.sh
          test -x ~/.local/opt/textpeach/TextPeach
          test -f ~/.local/opt/textpeach/installed.txt
          test -f ~/.local/share/applications/textpeach.desktop
          test -f ~/.local/share/icons/hicolor/256x256/apps/textpeach.png
          test -L ~/.local/bin/textpeach
          if command -v desktop-file-validate >/dev/null; then desktop-file-validate ~/.local/share/applications/textpeach.desktop; fi
          ~/.local/opt/textpeach/uninstall.sh
          test ! -e ~/.local/opt/textpeach
          test ! -e ~/.local/share/applications/textpeach.desktop
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" textpeach-linux-x64.tar.gz --clobber
